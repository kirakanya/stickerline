<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Destiny Sticker Store</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: #f5f5f5;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: white;
      padding: 28px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 28px;
      color: #111;
    }

    p {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #ddd;
      background: #fafafa;
      box-sizing: border-box;
      font-size: 14px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #999;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 15px;
      border: none;
      border-radius: 16px;
      background: #111;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .price-box {
      margin-top: 22px;
      background: #f7f7f7;
      padding: 18px;
      border-radius: 16px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 12px;
      color: #999;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Destiny Sticker Store</h1>
    <p>ร้านรับกดสติ๊กเกอร์ไลน์ราคาถูก ส่งไว</p>

    <form id="orderForm">
      <label>เลือกประเภทสินค้า</label>
      <select id="type" onchange="updatePrice()">
        <option value="35">Sticker 50 Coins - 35฿</option>
        <option value="59">Sticker 100 Coins - 59฿</option>
        <option value="89">LINE Theme - 89฿</option>
      </select>

      <label>ลิงก์สติ๊กเกอร์ / ธีม</label>
      <input type="text" id="link" placeholder="วางลิงก์ LINE STORE" required />

      <label>UID หรือชื่อ LINE ลูกค้า</label>
      <input type="text" id="uid" placeholder="กรอก UID หรือ @line" required />

      <label>ลิงก์สลิป</label>
      <input type="text" id="slip" placeholder="แนบลิงก์สลิป" required />

      <div class="price-box">
        ราคาทั้งหมด: <span id="price">35</span> บาท
      </div>

      <button type="submit">ส่งออเดอร์</button>
    </form>

    <div class="footer">
      หลังชำระเงิน ร้านจะดำเนินการภายใน 5-15 นาที
    </div>

    <hr style="margin:30px 0;border:none;border-top:1px solid #eee;">

    <h2 style="font-size:22px;">📦 ระบบดูออเดอร์</h2>

    <div id="orders"></div>
  </div>

  <script>
    function updatePrice() {
      const price = document.getElementById('type').value;
      document.getElementById('price').innerText = price;
    }

    const form = document.getElementById('orderForm');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const order = {
        type: document.getElementById('type').options[document.getElementById('type').selectedIndex].text,
        price: document.getElementById('price').innerText,
        link: document.getElementById('link').value,
        uid: document.getElementById('uid').value,
        slip: document.getElementById('slip').value,
        status: 'รอดำเนินการ',
        time: new Date().toLocaleString()
      };

      let orders = JSON.parse(localStorage.getItem('orders')) || [];
      orders.unshift(order);
      localStorage.setItem('orders', JSON.stringify(orders));

      renderOrders();
      form.reset();
      updatePrice();

      alert('ส่งออเดอร์เรียบร้อย');
    });

    function renderOrders() {
      const ordersDiv = document.getElementById('orders');
      let orders = JSON.parse(localStorage.getItem('orders')) || [];

      if (orders.length === 0) {
        ordersDiv.innerHTML = '<p style="text-align:center;color:#999;">ยังไม่มีออเดอร์</p>';
        return;
      }

      ordersDiv.innerHTML = '';

      orders.forEach((order, index) => {
        ordersDiv.innerHTML += `
          <div style="background:#fafafa;padding:18px;border-radius:18px;margin-top:15px;border:1px solid #eee;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <strong>${order.type}</strong>
              <span>${order.price}฿</span>
            </div>

            <p style="text-align:left;margin-top:10px;font-size:13px;word-break:break-all;">
              <b>UID:</b> ${order.uid}<br><br>
              <b>Link:</b><br>${order.link}<br><br>
              <b>Slip:</b><br>
              <a href="${order.slip}" target="_blank">ดูสลิป</a><br><br>
              <b>เวลา:</b> ${order.time}
            </p>

            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
              <span style="font-size:13px;padding:6px 12px;background:#eee;border-radius:999px;">
                ${order.status}
              </span>

              <button onclick="completeOrder(${index})" style="width:auto;padding:10px 14px;margin-top:0;">
                ส่งแล้ว
              </button>
            </div>
          </div>
        `;
      });
    }

    function completeOrder(index) {
      let orders = JSON.parse(localStorage.getItem('orders')) || [];
      orders[index].status = 'ส่งสำเร็จ';
      localStorage.setItem('orders', JSON.stringify(orders));
      renderOrders();
    }

    renderOrders();
  </script>
</body>
</html>
